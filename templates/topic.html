{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block content %}
<header class="page-head">
  <p class="eyebrow">SUBJECT</p>
  <h1>{{ topic.name }}</h1>
  <p>{{ topic.books }} 本书 · {{ topic.seconds|duration }}阅读时长</p>
</header>
<div class="book-grid">
  {% for book in topic_books %}
  {{ macros.book_card(book) }}
  {% endfor %}
</div>
{% endblock %}
