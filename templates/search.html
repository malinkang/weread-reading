{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <p class="eyebrow">FIND A BOOK</p>
  <h1>搜索书架</h1>
  <p>按书名、作者或主题查找。搜索索引很小，加载后完全在浏览器本地完成。</p>
</header>

<div class="search-page-box">
  <label for="search-page-input" class="sr-only">搜索书名、作者或主题</label>
  <input id="search-page-input" type="search" placeholder="例如：三体、刘慈欣、心理学…" autocomplete="off"
         data-search-url="{{ url('/data/search.json') }}">
</div>
<p class="filter-result" id="search-result" aria-live="polite"></p>
<div class="search-results" id="search-results"></div>
<div class="empty-state" id="search-empty" hidden>
  <p>没有找到匹配的书。</p>
  <p class="muted">试试更短的关键词，或者直接浏览 <a href="{{ url('/books/') }}">全部书籍</a>。</p>
</div>
{% endblock %}
